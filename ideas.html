<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideas - MindVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Mind<span>Vault</span></a>
      <button class="nav-toggle" type="button" aria-label="Open menu">☰</button>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="books.html">Books</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a class="active" href="ideas.html">Ideas</a></li>
          <li><a href="insights.html">Insights</a></li>
          <li><a href="motivation.html">Motivation</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Ideas</h1>
          <p>Capture thoughts before they disappear.</p>
        </div>
        <button class="btn" type="button" id="btn-open-add-idea">+ Capture Idea</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" type="button" data-idea-filter="all">All</button>
        <button class="filter-btn" type="button" data-idea-filter="Blog Idea">Blog Idea</button>
        <button class="filter-btn" type="button" data-idea-filter="Project Idea">Project Idea</button>
        <button class="filter-btn" type="button" data-idea-filter="Business Idea">Business Idea</button>
        <button class="filter-btn" type="button" data-idea-filter="Engineering Idea">Engineering Idea</button>
        <button class="filter-btn" type="button" data-idea-filter="Random Thought">Random Thought</button>
      </div>

      <input class="search-box" type="search" id="idea-search" placeholder="Search ideas...">

      <div class="items-grid" id="ideas-grid"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="add-idea-modal" hidden>
    <div class="modal">
      <h2>Capture Idea</h2>
      <form id="add-idea-form">
        <div class="form-group" id="idea-title-group">
          <label for="idea-title">Idea title</label>
          <input type="text" id="idea-title" placeholder="Short title">
          <p class="error-text"></p>
        </div>
        <div class="form-group" id="idea-category-group">
          <label for="idea-category">Category</label>
          <select id="idea-category">
            <option value="">Select category...</option>
            <option value="Blog Idea">Blog Idea</option>
            <option value="Project Idea">Project Idea</option>
            <option value="Business Idea">Business Idea</option>
            <option value="Engineering Idea">Engineering Idea</option>
            <option value="Random Thought">Random Thought</option>
          </select>
          <p class="error-text"></p>
        </div>
        <div class="form-group" id="idea-desc-group">
          <label for="idea-desc">Description</label>
          <textarea id="idea-desc" rows="4" placeholder="What is the idea?"></textarea>
          <p class="error-text"></p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" type="button" data-close-modal="add-idea-modal">Cancel</button>
          <button class="btn" type="submit">Save Idea</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Copyright 2026 MindVault</p>
      <div class="footer-links">
        <a href="books.html">Books</a>
        <a href="ideas.html">Ideas</a>
        <a href="motivation.html">Motivation</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
