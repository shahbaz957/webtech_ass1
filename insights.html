<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights - MindVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Mind<span>Vault</span></a>
      <button class="nav-toggle" type="button" aria-label="Open menu">☰</button>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="books.html">Books</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="ideas.html">Ideas</a></li>
          <li><a class="active" href="insights.html">Insights</a></li>
          <li><a href="motivation.html">Motivation</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Insights</h1>
          <p>Things I learned and do not want to forget.</p>
        </div>
        <button class="btn" type="button" id="btn-open-add-insight">+ Add Insight</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" type="button" data-insight-filter="all">All</button>
        <button class="filter-btn" type="button" data-insight-filter="AI">AI</button>
        <button class="filter-btn" type="button" data-insight-filter="Databases">Databases</button>
        <button class="filter-btn" type="button" data-insight-filter="System Design">System Design</button>
        <button class="filter-btn" type="button" data-insight-filter="Distributed Systems">Distributed Systems</button>
        <button class="filter-btn" type="button" data-insight-filter="Psychology">Psychology</button>
        <button class="filter-btn" type="button" data-insight-filter="Software Engineering">Software Engineering</button>
      </div>

      <div class="items-grid" id="insights-grid"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="add-insight-modal" hidden>
    <div class="modal">
      <h2>Add Insight</h2>
      <form id="add-insight-form">
        <div class="form-group" id="ins-title-group">
          <label for="ins-title">Title</label>
          <input type="text" id="ins-title" placeholder="What did you learn about?">
          <p class="error-text"></p>
        </div>
        <div class="form-group" id="ins-domain-group">
          <label for="ins-domain">Domain</label>
          <select id="ins-domain">
            <option value="">Select domain...</option>
            <option value="AI">AI</option>
            <option value="Databases">Databases</option>
            <option value="System Design">System Design</option>
            <option value="Distributed Systems">Distributed Systems</option>
            <option value="Psychology">Psychology</option>
            <option value="Software Engineering">Software Engineering</option>
          </select>
          <p class="error-text"></p>
        </div>
        <div class="form-group" id="ins-learn-group">
          <label for="ins-learn">What did you learn?</label>
          <textarea id="ins-learn" rows="4" placeholder="Write the insight in your own words..."></textarea>
          <p class="error-text"></p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" type="button" data-close-modal="add-insight-modal">Cancel</button>
          <button class="btn" type="submit">Save Insight</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Copyright 2026 MindVault</p>
      <div class="footer-links">
        <a href="books.html">Books</a>
        <a href="ideas.html">Ideas</a>
        <a href="motivation.html">Motivation</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
